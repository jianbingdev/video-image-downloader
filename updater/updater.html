<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>更新 视频图片下载器</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 14px/1.6 "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    color: #1f2937;
    background: #f6f7f9;
  }
  .card {
    width: 100%;
    max-width: 460px;
    padding: 26px 28px 24px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
  }
  h1 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  .sub { margin: 0 0 20px; font-size: 13px; color: #6b7280; }

  .steps { margin: 0 0 20px; padding: 0; list-style: none; }
  .steps li {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; font-size: 13px; color: #9ca3af;
  }
  .steps li .dot {
    flex: none; width: 16px; height: 16px; border-radius: 50%;
    border: 1.5px solid #d1d5db; background: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .steps li.done { color: #374151; }
  .steps li.done .dot { border-color: #15803d; background: #15803d; }
  .steps li.done .dot::after {
    content: ""; width: 7px; height: 4px;
    border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff;
    transform: rotate(-45deg) translateY(-1px);
  }
  .steps li.active { color: #1d4ed8; font-weight: 500; }
  .steps li.active .dot { border-color: #2563eb; }
  .steps li.active .dot::after {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: #2563eb;
  }

  .bar { height: 6px; border-radius: 3px; background: #eef1f4; overflow: hidden; margin-bottom: 8px; }
  .bar > i { display: block; height: 100%; width: 0; background: #2563eb; transition: width .18s ease; }
  .bar.indeterminate > i { width: 35%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .status { font-size: 12.5px; color: #6b7280; min-height: 18px; }

  .error {
    display: none; margin-top: 16px; padding: 11px 13px;
    background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px;
    font-size: 12.5px; color: #991b1b; word-break: break-all;
  }
  .error.show { display: block; }

  .actions { margin-top: 20px; display: flex; gap: 10px; }
  button {
    flex: 1; padding: 10px 14px; border-radius: 8px;
    border: 1px solid #d1d5db; background: #fff; font: inherit;
    font-size: 13.5px; color: #1f2937; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #93c5fd; background: #f8fbff; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.primary:hover:not(:disabled) { background: #1d4ed8; }
  button:disabled { color: #9ca3af; background: #f9fafb; cursor: default; }
  button[hidden] { display: none; }

  .hint { margin-top: 16px; font-size: 12px; color: #9ca3af; line-height: 1.6; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">正在更新</h1>
  <p class="sub" id="subtitle">版本信息读取中…</p>

  <ol class="steps" id="steps">
    <li data-step="dir"><span class="dot"></span><span>确认扩展文件夹</span></li>
    <li data-step="download"><span class="dot"></span><span>下载更新包</span></li>
    <li data-step="extract"><span class="dot"></span><span>解压并校验</span></li>
    <li data-step="write"><span class="dot"></span><span>写入文件</span></li>
    <li data-step="reload"><span class="dot"></span><span>重新加载扩展</span></li>
  </ol>

  <div class="bar" id="bar"><i></i></div>
  <div class="status" id="status">准备中…</div>

  <div class="error" id="error"></div>

  <div class="actions">
    <button id="btnPick" class="primary" hidden>选择扩展文件夹</button>
    <button id="btnRetry" class="primary" hidden>重试</button>
    <button id="btnClose" hidden>关闭</button>
  </div>

  <p class="hint" id="hint"></p>
</div>

<script src="zip.js"></script>
<script src="updater.js"></script>
</body>
</html>
